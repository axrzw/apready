name: map-check
# The map tracker path on Windows: PopTracker + a map pack, started with the exact arguments the app uses
# (app/maptracker.py), must log in to the room by itself.
on:
  workflow_dispatch:
  push:
    paths: ["app/maptracker.py", ".github/workflows/map-check.yml"]
jobs:
  map:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PopTracker opens the pack and connects to the room
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $room = Start-Process python -ArgumentList "-m","tools.relay_check_room","0" -RedirectStandardOutput room.log -RedirectStandardError room.err -PassThru -NoNewWindow
          $port = $null
          for ($i = 0; $i -lt 50 -and -not $port; $i++) { Start-Sleep -Milliseconds 200; if (Test-Path room.log) { $m = Select-String -Path room.log -Pattern "^RELAY (\d+)"; if ($m) { $port = [int]$m.Matches[0].Groups[1].Value } } }
          if (-not $port) { Get-Content room.err; throw "room did not start" }
          Invoke-WebRequest "https://github.com/black-sliver/PopTracker/releases/download/v0.36.0/poptracker_0-36-0_win64.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath tools
          New-Item -ItemType File tools/poptracker/portable.txt | Out-Null
          New-Item -ItemType Directory -Force tools/poptracker/packs | Out-Null
          Invoke-WebRequest "https://github.com/SapphireSapphic/TunicTracker/releases/download/2.3.0/TunicTracker.zip" -OutFile tools/poptracker/packs/tunic_sapphiresapphic.zip
          $pt = Start-Process tools/poptracker/poptracker.exe -WorkingDirectory tools/poptracker -ArgumentList "--load-pack","tunic_sapphiresapphic","--pack-variant","standard","--ap-host","127.0.0.1:$port","--ap-slot","Mishal" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep -Seconds 1; if (Select-String -Path room.log -Pattern '"cmd": "Connect"' -Quiet) { $ok = $true } }
          Get-Content room.log
          Stop-Process -Id $pt.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $room.Id -Force
          if (-not $ok) { throw "PopTracker did not connect to the room" }
          if (-not (Select-String -Path room.log -Pattern '"name": "Mishal"' -Quiet)) { throw "connected with the wrong slot" }
          Write-Host "OK: PopTracker opened the pack and logged in as Mishal"
