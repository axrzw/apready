name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the exe to this existing release (e.g. v0.2.0). Empty = only the artifact."
        required: false
        default: ""
# the release step adds APReady.exe to the release; the default token is read-only
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest
      - run: python -m pytest -q
      # the version shown in the corner of the app: the release tag, else dev-<commit>
      - name: Write version
        shell: python
        env:
          V: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.sha) }}
        run: |
          import os
          open("app/_version.py", "w").write(f"VERSION = {os.environ['V']!r}\n")
          print("version:", os.environ["V"])
      - run: pyinstaller --onefile --noconsole --icon app/icon.ico --name MyReadyAP --add-data "recipes;recipes" --add-data "ui;ui" run_app.py
      # Does Microsoft Defender flag the exe? (friends see "Windows cannot access the file" when it does)
      - name: Scan with Microsoft Defender
        continue-on-error: true
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Host
          & $mp -Scan -ScanType 3 -File "$PWD\dist\MyReadyAP.exe" -DisableRemediation | Out-Host
          Write-Host "defender exit code: $LASTEXITCODE (0 = clean, 2 = threat found)"
      # same exe under the old name too, so the link friends already have keeps working
      - run: copy dist\MyReadyAP.exe dist\APReady.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: MyReadyAP, path: dist/MyReadyAP.exe }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          files: |
            dist/MyReadyAP.exe
            dist/APReady.exe
          tag_name: ${{ inputs.release_tag || github.ref_name }}
