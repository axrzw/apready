name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the exe to this existing release (e.g. v0.2.0). Empty = only the artifact."
        required: false
        default: ""
# the release step adds APReady.exe to the release; the default token is read-only
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest
      - run: python -m pytest -q
      - run: pyinstaller --onefile --name APReady --add-data "recipes;recipes" --add-data "ui;ui" run_app.py
      - uses: actions/upload-artifact@v4
        with: { name: APReady, path: dist/APReady.exe }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          files: dist/APReady.exe
          tag_name: ${{ inputs.release_tag || github.ref_name }}
